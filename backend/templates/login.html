<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Guardianize</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="center-layout">
    <div class="auth-card">
        <div class="logo center-text">Guardianize<span>.enterprise</span></div>
        <p class="auth-subtitle">Sign in to your secure command center.</p>

        <form id="login-form" class="auth-form" action="/dashboard" method="GET">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="admin@guardianize.com" required>
            </div>
            <div class="form-group">
                <label for="password">Security Token / Password</label>
                <input type="password" id="password" placeholder="••••••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Authenticate</button>
        </form>
    </div>

    <script src="/static/js/app.js"></script>
</body>

</html>
