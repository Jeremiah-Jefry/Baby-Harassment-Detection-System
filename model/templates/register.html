<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardianEyes - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="register-container">
        <div class="register-box">

            <div class="header">
                <h1>GuardianEyes</h1>
                <p>Create your account</p>
            </div>

            <form action="/submit_register" method="POST" class="register-form">

                {% if error %}
                <div class="error-message">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    {{ error }}
                </div>
                {% endif %}

                <div class="form-section">
                    <h3>Parent Information</h3>

                    <div class="form-group">
                        <label for="parent_name">Parent Name</label>
                        <input type="text" id="parent_name" name="parent_name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="mobile">Mobile Number</label>
                            <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10-digit number" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="mail_password">Mail Password</label>
                        <input type="password" id="mail_password" name="mail_password" placeholder="Create a password" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" rows="3" placeholder="Your home address" required></textarea>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="form-section">
                    <h3>Camera Details</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="camera_ip">Camera IP Address</label>
                            <input type="text" id="camera_ip" name="camera_ip" placeholder="e.g., 192.168.1.101" required>
                        </div>
                        <div class="form-group">
                            <label for="app_password">App Password</label>
                            <input type="password" id="app_password" name="app_password" placeholder="Enter app password" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Register
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>

                <p class="login-link">
                    Already registered? <a href="/login">Sign In</a>
                </p>

            </form>
        </div>
    </div>

</body>
</html>
