<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Camera - GuardianEyes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='add_camera.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-navbar">
        <div class="nav-left">
            <a href="/camera-management" class="back-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Cameras
            </a>
            <h1 class="page-title">Add New Camera</h1>
        </div>
        <div class="nav-right">
            <a href="/alerts" class="nav-btn alerts-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                Alerts
            </a>
            <a href="/settings" class="nav-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3"></path>
                </svg>
                Settings
            </a>
            <a href="/logout" class="nav-btn logout-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">

            <div class="form-header">
                <div class="header-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </div>
                <div>
                    <h2>Register New Camera</h2>
                    <p class="form-subtitle">Add a new surveillance camera to your monitoring network</p>
                </div>
            </div>

            <form id="cameraForm" class="camera-form">
                <div class="field-group">
                    <label for="camera_id">
                        Camera ID <span class="req">*</span>
                    </label>
                    <div class="input-wrap">
                        <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="text" id="camera_id" name="camera_id" placeholder="CAM007" required autocomplete="off">
                    </div>
                    <span class="field-hint">Unique identifier e.g. CAM007 or CAM-HALL-01</span>
                </div>

                <div class="field-group">
                    <label for="camera_name">
                        Camera Name <span class="req">*</span>
                    </label>
                    <div class="input-wrap">
                        <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <input type="text" id="camera_name" name="camera_name" placeholder="Nursery Room - Side View" required>
                    </div>
                    <span class="field-hint">Descriptive name for easy identification</span>
                </div>

                <div class="two-col">
                    <div class="field-group">
                        <label for="location">
                            Location <span class="req">*</span>
                        </label>
                        <div class="input-wrap">
                            <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            <input type="text" id="location" name="location" placeholder="Baby Room" required>
                        </div>
                    </div>

                    <div class="field-group">
                        <label for="ip_address">
                            IP Address <span class="req">*</span>
                        </label>
                        <div class="input-wrap">
                            <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                            </svg>
                            <input type="text" id="ip_address" name="ip_address" placeholder="192.168.1.100" required>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="window.location.href='/camera-management'">
                        Cancel
                    </button>
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Add Camera
                    </button>
                </div>
            </form>

            <div id="notification" class="notification"></div>
        </div>
    </div>

    <script>
        document.getElementById('cameraForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const formData = {
                camera_id:   document.getElementById('camera_id').value.trim(),
                camera_name: document.getElementById('camera_name').value.trim(),
                location:    document.getElementById('location').value.trim(),
                ip_address:  document.getElementById('ip_address').value.trim()
            };
            const ipPattern = /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/;
            if (!ipPattern.test(formData.ip_address)) {
                showNotification('Please enter a valid IP address (e.g. 192.168.1.100)', 'error');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = `<svg class="spinner" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg> Adding...`;
            try {
                const res = await fetch('/submit-camera', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const data = await res.json();
                if (data.success) {
                    showNotification(data.message, 'success');
                    document.getElementById('cameraForm').reset();
                    setTimeout(() => { window.location.href = '/camera-management'; }, 1500);
                } else {
                    showNotification(data.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> Add Camera`;
                }
            } catch(err) {
                showNotification('An error occurred. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> Add Camera`;
            }
        });

        function showNotification(message, type) {
            const n = document.getElementById('notification');
            n.textContent = message;
            n.className = `notification ${type} show`;
            setTimeout(() => n.classList.remove('show'), 5000);
        }

        document.getElementById('ip_address').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^0-9.]/g, '');
        });

        document.getElementById('camera_id').addEventListener('input', function(e) {
            e.target.value = e.target.value.toUpperCase();
        });
    </script>
</body>
</html>
