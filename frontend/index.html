<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardianize | Enterprise Baby Monitoring</title>
    <!-- CSS and Fonts -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">

    <!-- ES6 Module Entry Point -->
    <script type="module" src="js/app.js" defer></script>
</head>

<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">Guardianize<span>.enterprise</span></h1>
            <p class="subtitle">AI-Powered Monitoring System</p>
            <div class="connection-status">
                <span class="status-dot"></span>
                <span id="conn-text">Connecting...</span>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="main-grid">
            <!-- Left Column: Primary Video & Dual Status -->
            <div class="primary-view">
                <!-- Video Container -->
                <div class="video-container">
                    <div class="video-header">
                        <h2>Live Inference Feed</h2>
                        <span class="live-badge">RT-DETR LIVE</span>
                    </div>
                    <div class="video-frame" id="video-frame">
                        <!-- Shows the real live feed from the user's camera -->
                        <video id="local-video" autoplay muted playsinline></video>
                        <!-- Hidden canvas used for extracting base64 frames to send to Backend -->
                        <canvas id="frame-canvas" style="display:none;"></canvas>

                        <!-- Overlay for styling -->
                        <div class="mock-camera-overlay">CAM 01 - NURSERY RT-DETR</div>
                    </div>
                </div>

                <!-- Dual Status Panels -->
                <div class="status-panels">
                    <div class="status-card" id="baby-status-card">
                        <div class="status-icon">👶</div>
                        <div class="status-info">
                            <h3>Baby Status</h3>
                            <p class="status-value safe" id="baby-status">Safe</p>
                        </div>
                    </div>
                    <div class="status-card" id="sitter-status-card">
                        <div class="status-icon">👤</div>
                        <div class="status-info">
                            <h3>Babysitter Status</h3>
                            <p class="status-value normal" id="sitter-status">Normal</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Dual Logs Container using CSS Grid -->
            <aside class="alerts-sidebar">
                <div class="alerts-header-global">
                    <h2>Real-time AI Alerts</h2>
                    <span class="alert-count" id="alert-count">0</span>
                </div>

                <div class="split-logs-container">
                    <!-- Column 1: Baby Vision Log -->
                    <div class="log-column">
                        <div class="log-header">Vision (RT-DETR)</div>
                        <div class="alerts-list" id="baby-alerts-list">
                            <div class="empty-alerts">
                                <p>No vision hazards.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Column 2: Babysitter Audio Log -->
                    <div class="log-column">
                        <div class="log-header">Audio (LSTM)</div>
                        <div class="alerts-list" id="sitter-alerts-list">
                            <div class="empty-alerts">
                                <p>No audio anomalies.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>
</body>

</html>
